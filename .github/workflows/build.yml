name: build

on:
  push:
    branches:
      - dev
  schedule:
    - cron: 0 */4 * * *
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -- patch.pathofexile.com:12995 output/poe1
      - run: cargo run --release -- patch.pathofexile2.com:13060 output/poe2
      - uses: stefanzweifel/git-auto-commit-action@v5
        id: autocommit
      - run: tree -H '.' --noreport --charset utf-8 -o index.html
        working-directory: output
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' || steps.autocommit.outputs.changes_detected == 'true'
        with:
          path: output
      - run: |
          for POE in poe1 poe2
          do
            echo "PRAGMA defer_foreign_keys = off" > $POE.sql
            cat sql/drop_tables.sql sql/create_tables.sql sql/create_indexes.sql >> $POE.sql
            cat output/$POE/*.sql >> $POE.sql
          done
    outputs:
      changes_detected: ${{ steps.autocommit.outputs.changes_detected }}

  gh-pages:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' || needs.build.outputs.changes_detected == 'true'
    steps:
      - name: deploy gh-pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

  db-uploads:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: poe1 export
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: d1 execute poe1-files poe1.sql
      - name: poe2 export
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: d1 execute poe2-files poe2.sql
