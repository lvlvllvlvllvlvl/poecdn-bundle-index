name: build

on:
  push:
    branches:
      - dev
  schedule:
    - cron: 0 */4 * * *
  workflow_dispatch:
    inputs:
      force_rebuild_poe1:
        description: Force rebuild poe1 database instead of using incremental update
        type: boolean
        required: false
        default: false
      force_rebuild_poe2:
        description: Force rebuild poe2 database instead of using incremental update
        type: boolean
        required: false
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -- poe1
      - run: cargo run --release -- poe2
      - uses: stefanzweifel/git-auto-commit-action@v5
        id: autocommit
      - name: Check for poe1 update script
        id: check_poe1_update
        run: |
          if [ -f "output/poe1/use_update_script" ]; then
            echo "USE_UPDATE=true" >> $GITHUB_OUTPUT
            echo "UPDATE_FILE=$(ls output/poe1/update-*.sql)" >> $GITHUB_OUTPUT
            echo "Found update script for poe1: $(ls output/poe1/update-*.sql)"
          else
            echo "USE_UPDATE=false" >> $GITHUB_OUTPUT
            echo "No update script found for poe1, will rebuild database"
          fi
      - name: Check for poe2 update script
        id: check_poe2_update
        run: |
          if [ -f "output/poe2/use_update_script" ]; then
            echo "USE_UPDATE=true" >> $GITHUB_OUTPUT
            echo "UPDATE_FILE=$(ls output/poe2/update-*.sql)" >> $GITHUB_OUTPUT
            echo "Found update script for poe2: $(ls output/poe2/update-*.sql)"
          else
            echo "USE_UPDATE=false" >> $GITHUB_OUTPUT
            echo "No update script found for poe2, will rebuild database"
          fi
      - name: Generate poe1 sql
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force_rebuild_poe1 }}" = "true" ]; then
            echo "Forced rebuild for poe1 via workflow_dispatch input"
            echo "PRAGMA defer_foreign_keys = off;" > poe1.sql
            cat sql/drop_tables.sql sql/create_tables.sql sql/create_indexes.sql >> poe1.sql
            cat output/poe1/*.sql >> poe1.sql
          elif [ "${{ steps.check_poe1_update.outputs.USE_UPDATE }}" == "true" ]; then
            echo "Using update script for poe1"
            cp "${{ steps.check_poe1_update.outputs.UPDATE_FILE }}" poe1.sql
          else
            echo "Rebuilding poe1 database from scratch"
            echo "PRAGMA defer_foreign_keys = off;" > poe1.sql
            cat sql/drop_tables.sql sql/create_tables.sql sql/create_indexes.sql >> poe1.sql
            cat output/poe1/*.sql >> poe1.sql
          fi
      - name: Generate poe2 sql
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force_rebuild_poe2 }}" = "true" ]; then
            echo "Forced rebuild for poe2 via workflow_dispatch input"
            echo "PRAGMA defer_foreign_keys = off;" > poe2.sql
            cat sql/drop_tables.sql sql/create_tables.sql sql/create_indexes.sql >> poe2.sql
            cat output/poe2/*.sql >> poe2.sql
          elif [ "${{ steps.check_poe2_update.outputs.USE_UPDATE }}" == "true" ]; then
            echo "Using update script for poe2"
            cp "${{ steps.check_poe2_update.outputs.UPDATE_FILE }}" poe2.sql
          else
            echo "Rebuilding poe2 database from scratch"
            echo "PRAGMA defer_foreign_keys = off;" > poe2.sql
            cat sql/drop_tables.sql sql/create_tables.sql sql/create_indexes.sql >> poe2.sql
            cat output/poe2/*.sql >> poe2.sql
          fi
      - name: Upload poe1 sql artifact
        uses: actions/upload-artifact@v4
        with:
          name: poe1-sql
          path: poe1.sql
      - name: Upload poe2 sql artifact
        uses: actions/upload-artifact@v4
        with:
          name: poe2-sql
          path: poe2.sql
      - run: tree -H '.' --noreport --charset utf-8 -o index.html
        working-directory: output
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.autocommit.outputs.changes_detected == 'true'
        with:
          path: output
    outputs:
      changes_detected: ${{ steps.autocommit.outputs.changes_detected }}
      poe1_use_update: ${{ steps.check_poe1_update.outputs.USE_UPDATE }}
      poe2_use_update: ${{ steps.check_poe2_update.outputs.USE_UPDATE }}

  poe1-upload:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'schedule' || needs.build.outputs.changes_detected == 'true'
    steps:
      - name: Download poe1 sql artifact
        uses: actions/download-artifact@v4
        with:
          name: poe1-sql
      - name: poe1 export
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: d1 execute poe1-files --remote --file=poe1.sql
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: latest

  poe2-upload:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'schedule' || needs.build.outputs.changes_detected == 'true'
    steps:
      - name: Download poe2 sql artifact
        uses: actions/download-artifact@v4
        with:
          name: poe2-sql
      - name: poe2 export
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: d1 execute poe2-files --remote --file=poe2.sql
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: latest

  gh-pages:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'schedule' || needs.build.outputs.changes_detected == 'true'
    steps:
      - name: deploy gh-pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
